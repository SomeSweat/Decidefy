<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Decision Wheel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Decision Wheel</h1>
  <canvas id="wheel" width="500" height="500"></canvas>
  <button id="spinBtn">Spin</button>
  <div id="result">
    <h2 id="choice"></h2>
    <div id="arguments">
      <h3>Pro</h3>
      <ul id="proList"></ul>
      <h3>Contra</h3>
      <ul id="contraList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
